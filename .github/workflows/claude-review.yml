# Stage 5: AI in the PR review loop. Findings are advice; CODEOWNERS approval is still required.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} following REVIEW.md exactly.
            Compare the diff with the spec.md and plan.md it changes or references under specs/.
            Apply .claude/skills/api-security/SKILL.md for the security pass.
            Post inline comments for findings and one summary comment. Do not approve or request changes.
          claude_args: --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
